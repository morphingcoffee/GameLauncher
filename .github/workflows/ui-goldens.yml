name: UI goldens

on:
  pull_request:
  workflow_dispatch:
    inputs:
      update_golden:
        description: >-
          Regenerate golden baselines on macos-15 and upload them as an artifact
          (download + commit under launcher/composeApp/screenshots/golden/).
        type: boolean
        default: false

concurrency:
  group: ui-goldens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  goldens:
    name: Compose UI goldens (macos-15)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # AGP modules still resolve an Android SDK even for desktopTest (Compose @Preview targets).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./launcher/gradlew

      - name: Run desktopTest (goldens)
        working-directory: launcher
        run: |
          args=(:composeApp:desktopTest --no-daemon)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.update_golden }}" = "true" ]; then
            args+=(-PupdateGolden)
          fi
          ./gradlew "${args[@]}"

      - name: Upload expected / actual / diff screenshots
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.update_golden)
        uses: actions/upload-artifact@v7
        with:
          name: ui-goldens-${{ github.run_id }}
          path: |
            launcher/composeApp/screenshots/golden/
            launcher/composeApp/build/screenshots/
          if-no-files-found: warn
